name: Run Script
on:
  schedule:
    - cron: '0 9,15 * * *'  # 每天早上9点和下午3点
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run
        run: trae_auto_sign.py
